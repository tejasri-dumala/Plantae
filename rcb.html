<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details and Cart</title>
<style>
  /* Style for product details */
  #product-details {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #fff;
    padding: 20px;
    border: 1px solid #ccc;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    z-index: 9999;
  }

  /* Style for cart */
  #cart {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #fff;
    padding: 20px;
    border: 1px solid #ccc;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    z-index: 9999;
  }

  /* Style for cart items */
  .cart-item {
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<!-- Image 1 to click -->
<img src="C:\Users\kethi\Desktop\karthik\z8.jpeg" alt="Product 1" onclick="addToCart('Product 1', 'Description of Product 1', 29.99)">

<!-- Image 2 to click -->
<img src="C:\Users\kethi\Desktop\karthik\y1.jpg" alt="Product 2" onclick="addToCart('Product 2', 'Description of Product 2', 39.99)">

<!-- Product Details Modal -->
<div id="product-details">
  <h2 id="product-name"></h2>
  <p id="product-description"></p>
  <p id="product-price"></p>
  <button onclick="addToCart()">Add to Cart</button>
  <button onclick="hideDetails()">Close</button>
</div>

<!-- Cart Modal -->
<div id="cart">
  <h2>Shopping Cart</h2>
  <div id="cart-items"></div>
  <button onclick="buyAll()">Buy All</button>
  <button onclick="hideCart()">Close</button>
</div>

<!-- View Cart Button -->
<button onclick="showCart()">View Cart</button>

<!-- JavaScript -->
<script>
  let cartItems = [];

  // Function to show product details
  function showDetails(name, description, price) {
    document.getElementById('product-name').textContent = name;
    document.getElementById('product-description').textContent = description;
    document.getElementById('product-price').textContent = 'Price: $' + price.toFixed(2);
    document.getElementById('product-details').style.display = 'block';
  }

  // Function to hide product details
  function hideDetails() {
    document.getElementById('product-details').style.display = 'none';
  }

  // Function to add product to cart
  function addToCart(name, description, price) {
    cartItems.push({ name: name, description: description, price: price });
    alert('Product added to cart!');
  }

  // Function to show cart
  function showCart() {
    const cartItemsDiv = document.getElementById('cart-items');
    cartItemsDiv.innerHTML = '';
    if (cartItems.length === 0) {
      cartItemsDiv.textContent = 'Your cart is empty.';
    } else {
      cartItems.forEach(item => {
        const itemDiv = document.createElement('div');
        itemDiv.classList.add('cart-item');
        itemDiv.innerHTML = `
          <h3>${item.name}</h3>
          <p>${item.description}</p>
          <p>Price: $${item.price.toFixed(2)}</p>
          <button onclick="buyItem('${item.name}')">Buy Now</button>
        `;
        cartItemsDiv.appendChild(itemDiv);
      });
    }
    document.getElementById('cart').style.display = 'block';
  }

  // Function to hide cart
  function hideCart() {
    document.getElementById('cart').style.display = 'none';
  }

  // Function to buy all items in the cart
  function buyAll() {
    alert('All items purchased!');
  }

  // Function to buy a specific item
  function buyItem(name) {
    alert(`Item "${name}" purchased!`);
  }
</script>

</body>
</html>
